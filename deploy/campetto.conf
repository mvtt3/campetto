<VirtualHost *:80>
    ServerName campetto.lorenzoo.it

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog /var/log/httpd/campetto-error.log
    CustomLog /var/log/httpd/campetto-access.log combined
</VirtualHost>
